# service.yaml - exposes the parking app outside the cluster
#   Open in browser: http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: parking-app-service
spec:
  type: NodePort
  selector:
    app: parking-app
  ports:
    - port: 80            # port inside the cluster
      targetPort: 5000    # port of the container
      nodePort: 30080     # port on your computer
